<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Waterways</title>
    <meta name="theme-color" content="#f4efe3" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <style>
      :root { --paper: #f4efe3; --ink: #243b4a; --canal: #4f95bd; --line: #cfc5a8; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden;
        font: 15px/1.35 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #hud { flex: none; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 14px; }
      #hud .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #hud .stat { white-space: nowrap; }
      #hud .stat b { font-variant-numeric: tabular-nums; }
      #hud .gauge { display: inline-block; width: 70px; height: 10px; background: rgba(36, 59, 74, .12); border-radius: 6px; overflow: hidden; vertical-align: middle; }
      #hud .gauge i { display: block; height: 100%; background: var(--canal); }
      button { font: inherit; color: var(--ink); background: rgba(36, 59, 74, .08); border: 0;
        border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer; touch-action: manipulation;
        transition: background .15s; }
      button:hover { background: rgba(36, 59, 74, .16); }
      button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
      button:disabled { opacity: .4; cursor: default; }
      button:focus-visible, input:focus-visible { outline: 3px solid #0072b2; outline-offset: 2px; }
      canvas { display: block; flex: 1; min-height: 0; width: 100%; touch-action: none; }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(244, 239, 227, .94); padding: 16px; overflow: auto; }
      .overlay[hidden] { display: none; }
      .panel { max-width: 560px; width: 100%; display: grid; gap: 12px; }
      .panel h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
      .panel p { margin: 0; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
      .card { text-align: left; padding: 16px; display: grid; gap: 4px; border-radius: 16px; background: #fff; box-shadow: 0 2px 0 rgba(36, 59, 74, .12), 0 8px 24px rgba(36, 59, 74, .08); }
      .card:hover { background: #fff; transform: translateY(-2px); }
      .card strong { font-size: 18px; }
      .menu-btn { text-align: left; padding: 12px 18px; border-radius: 16px; }
      .menu-btn small { display: block; opacity: .75; }
      label { display: flex; gap: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <header id="hud"></header>
    <canvas id="game"></canvas>
    <div id="cards" class="overlay" hidden></div>
    <div id="menu" class="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
